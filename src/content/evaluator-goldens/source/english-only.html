<!doctype html><html lang="en"><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d1d1f;background:#fff;width:480px}header{padding:20px 24px;border-bottom:1px solid #ddd;font-weight:700}main{padding:24px}h1{font-size:26px;margin:0 0 8px}label{display:block;font-weight:600;margin:18px 0 6px}input,select{width:100%;padding:12px;border:1px solid #8a8a8a;border-radius:6px;font:inherit}button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:8px;font:inherit;font-weight:700}footer{padding:16px 24px;font-size:12px;color:#555}</style></head><body>
