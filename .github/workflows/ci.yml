name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a PR can change what the app renders. The accessibility
  # suite is slow, so it skips PRs that only touch docs, Markdown or
  # repo tooling. Pushes to main always run it. A skipped job counts as
  # passing for required checks, so this doesn't block auto-merge.
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr diff "$PR" --repo "$REPO" --name-only)
          echo "$files"
          if echo "$files" | grep -vE '(\.md$|^docs/|^\.claude/|^\.github/workflows/automerge\.yml$)' | grep -q .; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Typecheck, lint, contrast, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:contrast
      - run: npm run test:unit
      - run: npm run build

  accessibility:
    name: Accessibility (axe, reflow, zoom, text spacing)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds and serves the app itself (tests/playwright.config.ts), then checks every page in light and dark.
      - run: npm run test:a11y
